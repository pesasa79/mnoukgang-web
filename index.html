function resize() {

}

      for (let k = 0; k < HEROES.length; k++) { if (inside(p, eqBtn(k)) && !heroFull(HEROES[k])) { SFX.click(); eqHero = k; break; } if (inside(p, heroBtn(k))) { if (!upgrade(k)) SFX.click(); break; } if (p.y > heroRowY(k) && p.y < heroRowY(k) + 102) { heroCard = k; SFX.hero(k); break; } } }
    if (scene === "map" && scrollDrag.moved < 14 && !scrollDrag.fly) { const done = progOf(mapAct, diff);  // ťuknutí na úroveň: okno s nepřáteli a odměnou
      for (let i = 0; i < PER_ACT; i++) { const q = stagePos(i); if (i + 1 <= done + 1 && Math.hypot(scrollDrag.x - q.x, scrollDrag.y - q.y) < 56) { levelPop = PER_ACT * (mapAct - 1) + i + 1; LPI = levelInfo(levelPop); scrollV = 0; SFX.click(); break; } } }
    // krátké ťuknutí (bez posunu a ne do rozjetého seznamu) otevře kartu nepřítele
    if (scene === "best" && scrollDrag.moved < 14 && !scrollDrag.fly && performance.now() - q[0][0] < 500) { const r = bestRows.find(r => scrollDrag.y >= r[1] && scrollDrag.y <= r[2] && scrollDrag.y > 150 && scrollDrag.y < 1155); if (r) { scrollV = 0; foeCard = r[0]; SFX.foe(r[0], FOES[r[0]].boss, "attack"); } } }
  scrollDrag = null;
  if (drag && !busy && scene === "play" && board[drag.c][drag.r].sp === "diamond") tapDiamond(drag.c, drag.r);
  drag = null;
}
cv.addEventListener("touchstart", down, { passive: false }); cv.addEventListener("touchmove", move, { passive: false }); cv.addEventListener("touchend", up);
cv.addEventListener("mousedown", down); addEventListener("mousemove", move); addEventListener("mouseup", up);
</script>
